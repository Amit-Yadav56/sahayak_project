<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sahayak (Whost) — Welfare Scheme Discovery & Eligibility</title>
  <meta name="description" content="A simple and accessible React showcase for Sahayak: discovering and verifying Indian government welfare schemes using intelligent eligibility matching." />
  <link rel="stylesheet" href="src/index.css" />

  <!-- React 18 & Babel Standalone for instant zero-dependency browser execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Load App with Babel -->
  <script type="text/babel" data-type="module">
    import App from "./src/App.jsx";
    
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
